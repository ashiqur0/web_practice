<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(1, 2fr) 2fr;
            grid-template-rows: repeat(1, 4fr) ;
        }
        .box {
            
        }
        #box1 {
            background-color: rgb(250, 6, 79);   
        }
        #box2 {
            background-color: rgb(250, 152, 6);
        }
        #box3 {
            background-color: rgb(158, 27, 115);
        }
        #box4 {
            background-color: rgb(104, 99, 104);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
    </div>
</body>
</html>
