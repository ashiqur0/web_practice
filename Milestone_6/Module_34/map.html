<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <ol id="container" style="font-size: 36px;">

    </ol>

    <script>
        const fruits = ['apple', 'banana', 'cherry', 'kiwi', 'melon'];
        document.getElementById('container').innerHTML = fruits.map(e => `<li>${e}</li>`);
    </script>
</body>
</html>
